<!DOCTYPE html>
<html lang="ru" data-ui-scale="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест на свежесть кода</title>
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/debug-easter-egg.css">
</head>
<body>
    <main class="debug-easter-egg-window">
        <header class="debug-easter-egg-header">
            <div>
                <h1>Тест на свежесть кода</h1>
                <p id="debugEasterEggHint">Выберите фото, затем нажимайте по нему.</p>
            </div>
            <div class="debug-easter-egg-actions">
                <label class="debug-easter-egg-file" for="debugEasterEggFile">Выбрать фото</label>
                <input id="debugEasterEggFile" type="file" accept=".png,.jpg,.jpeg,.jpe,.webp,.gif,.bmp,.svg,.avif,image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,image/avif">
                <button id="debugEasterEggClear" type="button">Очистить</button>
                <button id="debugEasterEggClose" type="button" aria-label="Закрыть окно">×</button>
            </div>
        </header>
        <div id="debugEasterEggTarget" class="debug-easter-egg-target">
            <img id="debugEasterEggPortrait" alt="Выбранное фото" hidden>
        </div>
    </main>
    <script src="../../js/debug-easter-egg.js"></script>
</body>
</html>
