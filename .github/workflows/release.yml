name: Release DashBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: node test/run-all-tests.js
      - name: Test Windows installer
        shell: pwsh
        run: ./scripts/Install-DashBridge.ps1 -SelfTest
      - name: Build release archive
        shell: pwsh
        run: ./scripts/build-release.ps1 -ExpectedTag '${{ github.ref_name }}'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          gh release create "$GITHUB_REF_NAME" \
            "dist/DashBridge-$VERSION.zip" \
            "dist/DashBridge-$VERSION.zip.sha256" \
            "dist/Install-DashBridge.ps1" \
            "dist/Install-DashBridge.ps1.sha256" \
            --verify-tag \
            --generate-notes \
            --title "DashBridge $VERSION"
