name: Release DashBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch annotated release tag
        run: |
          git fetch --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: xvfb-run -a node test/run-all-tests.js
      - name: Lint extension
        run: npm run lint
      - name: Browser smoke
        run: xvfb-run -a npm run test:browser
      - name: Test Windows installer
        shell: pwsh
        run: |
          ./scripts/Install-DashBridge.ps1 -SelfTest
          ./test/installer_regressions.ps1
      - name: Build release archive
        shell: pwsh
        run: ./scripts/build-release.ps1 -ExpectedTag '${{ github.ref_name }}'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "dist/DashBridge-$VERSION.zip" \
            "dist/DashBridge-$VERSION.zip.sha256" \
            "dist/Install-DashBridge.ps1" \
            "dist/Install-DashBridge.ps1.sha256" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "DashBridge $VERSION"
